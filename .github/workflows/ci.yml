# The gate. Every command in here has a twin in lefthook.yml, so a green
# pre-commit means a green pipeline and neither can drift into being the only
# place a rule is enforced.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned by digest, not just the "base-devel" tag, so makepkg and namcap
  # can't drift out from under this workflow between runs. `docker run`
  # rather than the job-level `container:` key: a container job needs
  # Node.js already inside the image to run actions/checkout itself, and
  # this image doesn't have it — running the pinned image as a plain step
  # sidesteps that instead of layering a nodejs install in front of it.
  ARCH_IMAGE: archlinux:base-devel@sha256:68bfc3b0d277b08a99101dc9b94aaa03e5ae70cf1b4fb965c03b2b87b915760d

jobs:
  # Builds and namcap-lints both packages. `example-git` clones this repo's
  # own `main` over the network from inside the container, so this only
  # passes once the workflow's own checkout has actually reached GitHub.
  #
  # `.` is skipped on release-please's own PR: its `source=` fetches the
  # release tarball by tag, and that tag genuinely doesn't exist until this
  # very PR merges and cuts it. No amount of fixing PKGBUILD/.SRCINFO on the
  # PR itself changes that -- `regenerate-release-metadata` (release-please.yml)
  # validates the real thing post-merge, once the tag is real. `example-git`
  # has no such dependency (its pkgver() derives from `git describe` against
  # the already-existing repo, not a not-yet-created tag) and still runs.
  build:
    strategy:
      fail-fast: false
      matrix:
        package: [".", "example-git"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # matrix isn't available in a job-level if: (confirmed via actionlint),
      # so the skip has to live on both steps instead -- a job with every
      # step skipped still reports as skipped overall.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.package != '.' || !startsWith(github.head_ref, 'release-please--')
        with:
          fetch-depth: 0
      - name: Build and namcap-lint ${{ matrix.package }}
        if: matrix.package != '.' || !startsWith(github.head_ref, 'release-please--')
        run: |
          docker run --rm -v "$PWD":/repo -w /repo "$ARCH_IMAGE" \
            bash -c './.ci/build-and-lint.sh "${{ matrix.package }}"'

  # A PKGBUILD changes far more often than anyone remembers to regenerate
  # .SRCINFO by hand — this is the check that they never drift apart.
  #
  # Skipped on release-please's own PR for the same reason as `build (.)`
  # above: release-please bumps pkgver in PKGBUILD but the checksum
  # embedded in both PKGBUILD and .SRCINFO can't be the real one yet (the
  # tag it's computed against doesn't exist pre-merge), so this check would
  # only ever confirm PKGBUILD and .SRCINFO agree on a checksum both know
  # is a placeholder -- not worth pretending to validate.
  srcinfo:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check .SRCINFO is not stale
        # No git in this image and none needed — makepkg --printsrcinfo only
        # reads the PKGBUILD, it doesn't touch .git.
        run: |
          docker run --rm -v "$PWD":/repo -w /repo "$ARCH_IMAGE" \
            bash -c './.ci/check-srcinfo.sh'

  # A source entry whose local name doesn't carry $pkgver even though its
  # URL does collides across versions in makepkg's source cache -- see
  # rules/packaging.md and check-source-filenames.sh's own comment for the
  # mechanism. Pure text inspection, no makepkg/docker needed.
  source-filenames:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./.ci/check-source-filenames.sh

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Preinstalled on the ubuntu-latest runner image — no separate action
      # or install step needed.
      - run: shellcheck .ci/*.sh example.sh

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        # Frozen, so a drifted lockfile fails the job rather than silently
        # resolving to something nobody committed.
        run: bun install --frozen-lockfile
      - name: prettier --check
        run: bun run format:check
      - name: markdownlint
        run: bun run lint:md

  # A hook is something you can skip, and the version number depends on
  # these messages being right, so the whole branch is checked here too.
  # pr-title.yml checks the pull request title itself, which this never
  # sees.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: commitlint
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
