# Nobody picks a version. release-please reads the Conventional Commits that
# land on main and, when there's something to release, opens (or updates) a
# release pull request proposing the next version. Merging that pull request
# is what actually tags the release — no separate release job, unlike
# semantic-release's push-and-tag-in-one-step. See README.md's "Two release
# channels" section for what the tag means to the stable PKGBUILD.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
