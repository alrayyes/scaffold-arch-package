# Enabled from day one, not deferred. A public repo gets unlimited GitHub
# Actions minutes, so there's no metering reason to wait — and a dependency
# bump that needs a config change on our side is better caught on the
# template itself than on day one of the first real project cloned from it.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      # github-actions changes the pipeline, not what ships, so this stays
      # ci: rather than fix: — see releases.md's "Dependency bots" section.
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # Nothing here is JavaScript — package.json exists so commitlint can
  # resolve the shared config it extends, which bunx alone cannot do.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: chore
      include: scope
    groups:
      tooling:
        patterns: ["*"]
        update-types: [minor, patch]
